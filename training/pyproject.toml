[project]
name = "veridoc-ft"
version = "0.1.0"
description = "Veridoc AI — reproducible LoRA fine-tuning + evaluation for structured financial-fact extraction."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # Pinned-ish ranges; the exact resolved versions are recorded in the run
    # manifest at train time. Transformers >=4.51 is required for Qwen3.
    "torch>=2.2,<3",
    # Pinned below transformers 5: v5 removed TrainingArguments.warmup_ratio and
    # transformers.HybridCache (which older peft imports), breaking the LoRA
    # trainer + smoke test. Reverts Dependabot #10; the v5 migration is tracked
    # separately (needs the new warmup API + peft>=0.18).
    "transformers>=4.51,<5",
    "peft>=0.11,<0.18",
    "datasets>=2.19,<6",
    "accelerate>=0.30,<2",
    "pydantic>=2.8,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# 4-bit QLoRA on CUDA. Not used on CPU or on Turing (no bf16) cards.
qlora = ["bitsandbytes>=0.43; platform_system == 'Linux'"]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.6,<0.9",
    "mypy>=1.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veridoc_ft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict baseline: our own deprecations fail the suite; only the fast-moving ML
# stack (which we don't control) is scope-ignored.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:transformers.*",
    "ignore::DeprecationWarning:datasets.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:peft.*",
    "ignore::DeprecationWarning:accelerate.*",
    # torch/accelerate/bitsandbytes emit many benign hardware/CPU UserWarnings.
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Strong first-party checking. We deliberately do NOT enable `disallow_any_generics`
# or `disallow_untyped_calls` (as services/ai does): this package wraps the untyped
# torch/transformers/peft stack, so those checks would only force `type: ignore`
# on every library call without catching real bugs. Everything else that finds
# first-party mistakes is on.
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
