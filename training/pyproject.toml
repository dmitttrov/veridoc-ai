[project]
name = "veridoc-ft"
version = "0.1.0"
description = "Veridoc AI — reproducible LoRA fine-tuning + evaluation for structured financial-fact extraction."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # Pinned-ish ranges; the exact resolved versions are recorded in the run
    # manifest at train time. Transformers >=4.51 is required for Qwen3.
    "torch>=2.2",
    "transformers>=4.51,<5",
    "peft>=0.11,<0.18",
    "datasets>=2.19,<4",
    "accelerate>=0.30,<2",
    "pydantic>=2.8,<3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# 4-bit QLoRA on CUDA. Not used on CPU or on Turing (no bf16) cards.
qlora = ["bitsandbytes>=0.43; platform_system == 'Linux'"]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<0.9",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veridoc_ft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
