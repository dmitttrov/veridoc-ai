name: CI

on:
  push:
    branches: [main]
  pull_request:

# Avoid redundant runs on rapid pushes to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (contracts, api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Contracts must be built first so api/web resolve the package.
      - run: npm run build:contracts
      - name: Lint
        run: npm run lint
      - name: Format check (web + api)
        run: |
          npm run format:check --workspace @veridoc/web
          npm run format:check --workspace @veridoc/api
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Production build (api + web)
        run: |
          npm run build --workspace @veridoc/api
          npm run build --workspace @veridoc/web

  python:
    name: Python (ai service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    services:
      postgres:
        # Pinned by digest for reproducible CI (pgvector/pgvector:pg16).
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: veridoc
          POSTGRES_PASSWORD: veridoc
          POSTGRES_DB: veridoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veridoc -d veridoc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Enables the DB-backed integration tests (skipped when unset).
      VERIDOC_TEST_DATABASE_URL: postgresql://veridoc:veridoc@localhost:5432/veridoc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install (hash-pinned dev lock, then the package)
        # Reproducible: resolved + hash-verified from the committed lock, not
        # re-resolved on every run. Regenerate with:
        #   uv pip compile pyproject.toml --extra dev --python-version 3.11 \
        #     --python-platform linux --generate-hashes -o requirements-dev.lock
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app
      - name: Test (pytest, incl. DB integration)
        run: pytest
      - name: Retrieval evaluation (deterministic embeddings) + regression gate
        # Deterministic eval; --min-recall is a catastrophic-regression floor
        # (well below measured), not a target. Tighten once calibrated in CI.
        run: python -m app.eval.run --min-recall 0.5
        env:
          AI_DATABASE_URL: postgresql://veridoc:veridoc@localhost:5432/veridoc
          AI_EMBEDDING_PROVIDER: deterministic

  training:
    name: Python (training / fine-tuning)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      # CPU-only torch keeps CI light; the LoRA smoke test uses a tiny random model.
      - name: Install (CPU torch + dev extras)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy veridoc_ft
      - name: Test (pytest, incl. CPU LoRA smoke test)
        run: pytest

  images:
    name: Images (build + Trivy scan)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: infra/docker/api.Dockerfile }
          - { name: ai, dockerfile: infra/docker/ai.Dockerfile }
          - { name: web, dockerfile: infra/docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.name }} image
        run: docker build -f ${{ matrix.dockerfile }} -t veridoc-${{ matrix.name }}:ci .
      - name: Scan ${{ matrix.name }} image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: veridoc-${{ matrix.name }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Don't fail on CVEs with no fix available yet (noise); re-scan picks
          # them up once a fixed base image or dependency is released.
          ignore-unfixed: true

  helm:
    name: Helm chart (lint + template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint infra/helm/veridoc
      - name: Template (bundled Postgres defaults)
        run: helm template veridoc infra/helm/veridoc > /dev/null
      - name: Template (external DB + production toggles)
        run: |
          helm template veridoc infra/helm/veridoc \
            --set postgresql.enabled=false \
            --set externalDatabase.url=postgresql://u:p@db.example:5432/veridoc \
            --set ingress.enabled=true \
            --set api.autoscaling.enabled=true \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true > /dev/null
