name: CI

on:
  push:
    branches: [main]
  pull_request:

# Avoid redundant runs on rapid pushes to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (contracts, api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Contracts must be built first so api/web resolve the package.
      - run: npm run build:contracts
      - name: Lint
        run: npm run lint
      - name: Format check (web + api)
        run: |
          npm run format:check --workspace @veridoc/web
          npm run format:check --workspace @veridoc/api
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Production build (api + web)
        run: |
          npm run build --workspace @veridoc/api
          npm run build --workspace @veridoc/web

  python:
    name: Python (ai service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veridoc
          POSTGRES_PASSWORD: veridoc
          POSTGRES_DB: veridoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veridoc -d veridoc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Enables the DB-backed integration tests (skipped when unset).
      VERIDOC_TEST_DATABASE_URL: postgresql://veridoc:veridoc@localhost:5432/veridoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app
      - name: Test (pytest, incl. DB integration)
        run: pytest
      - name: Retrieval evaluation (deterministic embeddings)
        run: python -m app.eval.run
        env:
          AI_DATABASE_URL: postgresql://veridoc:veridoc@localhost:5432/veridoc
          AI_EMBEDDING_PROVIDER: deterministic

  training:
    name: Python (training / fine-tuning)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      # CPU-only torch keeps CI light; the LoRA smoke test uses a tiny random model.
      - name: Install (CPU torch + dev extras)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy veridoc_ft
      - name: Test (pytest, incl. CPU LoRA smoke test)
        run: pytest
