name: Release

# Publishes versioned container images to GHCR so the Helm chart can pull them.
#   - push tag vX.Y.Z         -> tags: X.Y.Z, X.Y, latest, sha-<short>
#   - manual dispatch         -> tags: sha-<short>, edge
# Images: ghcr.io/<owner>/veridoc-{api,ai,web}
# Note: main pushes are already built + Trivy-scanned by ci.yml, so this
# release pipeline only runs on version tags (and manual dispatch) to avoid
# double-building every commit and to publish on deliberate releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: infra/docker/api.Dockerfile }
          - { name: ai, dockerfile: infra/docker/ai.Dockerfile }
          - { name: web, dockerfile: infra/docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/veridoc-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Build once and load locally so we can scan the exact image before publishing.
      - name: Build (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: veridoc-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Scan (Trivy — fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: veridoc-${{ matrix.name }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
