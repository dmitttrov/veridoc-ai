[project]
name = "veridoc-ai-service"
version = "0.1.0"
description = "Veridoc AI inference service (FastAPI). Deterministic mock provider for Phase 1; vLLM/OpenAI-compatible backends later."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<0.144",
    "uvicorn[standard]>=0.30,<0.55",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9,<0.1",
    "asyncpg>=0.29,<0.33",
    "pgvector>=0.3.2,<0.4",
    "pypdf>=4.3,<6",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.29",
    "ruff>=0.6,<0.9",
    "mypy>=1.11,<2",
    "reportlab>=4.2,<5",
]
# Real local embedding model. Heavy (torch); install only when you want to run
# the sentence-transformers provider: pip install -e ".[dev,embeddings]"
embeddings = [
    "sentence-transformers>=3.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Strict baseline: warnings fail the suite, except known upstream ones.
filterwarnings = [
    "error",
    # Third-party deprecations we don't control (starlette TestClient -> anyio).
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:anyio.*",
    # Known FastAPI+pydantic interaction: using an `alias_generator` on a request
    # -body model surfaces a spurious UnsupportedFieldAttributeWarning during
    # OpenAPI schema generation. Aliasing is verified to work by the SSE tests.
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are intended as argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Third-party packages without type stubs / py.typed markers.
module = ["asyncpg.*", "pgvector.*", "reportlab.*", "sentence_transformers.*"]
ignore_missing_imports = true
