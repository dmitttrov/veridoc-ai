server {
    # Unprivileged nginx: listen on a high port so no root is needed to bind.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container health endpoint for Kubernetes liveness/readiness probes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Runtime config is regenerated per environment at startup — never cache it.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
