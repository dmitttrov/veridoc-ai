# GPU overlay: real inference via vLLM serving the PINNED Qwen3-0.6B base plus
# the LoRA adapter (adapter-v2) as the model id "veridoc-extract" (ADR-0021/0027).
#
# Usage, on a CUDA host with the NVIDIA container toolkit installed:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.vllm.yml up -d
#
# Prerequisite: the adapter weights at training/artifacts/adapter-v2/
# (adapter_config.json + adapter_model.safetensors, SHA-256 165518747f28…).
# Weights are git-ignored; fetch them from the GPU server first.
#
# Model selection is per request via the model id the AI service asks for:
#   AI_INFERENCE_MODEL=veridoc-extract   -> base + LoRA adapter-v2 (default here)
#   AI_INFERENCE_MODEL=Qwen/Qwen3-0.6B   -> pinned base, no adapter (baseline runs)
#
# vLLM stays INTERNAL ONLY (no host port), like the AI service and the DB:
# only the AI service talks to it.
#
# Thinking mode is a single switch with two measured operating points (see
# docs/EVALUATION.md "Serving validation"):
#   extraction (default):  VLLM_ENABLE_THINKING=false — matches the adapter's
#       training/eval inference path (enable_thinking=False); strict JSON out.
#   grounded QA:           VLLM_ENABLE_THINKING=true AI_INFERENCE_MAX_TOKENS=2048
#       — with thinking off the 0.6B base answers the QA prompt with the
#       abstain sentinel even when the gold passage is [E1]; with thinking on
#       it reasons to the correct cited answer. --reasoning-parser qwen3 keeps
#       the thinking trace out of message content either way, so it can never
#       leak into a streamed RAG answer. Requests can still override per call.

services:
  vllm:
    # Pinned by digest for reproducibility (vllm/vllm-openai:v0.33.0).
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    command:
      - --model
      - Qwen/Qwen3-0.6B
      - --revision
      - c1899de289a04d12100db370d81485cdf75e47ca
      - --enable-lora
      - --lora-modules
      - veridoc-extract=/adapters/adapter-v2
      - --max-lora-rank
      - "16"
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking": ${VLLM_ENABLE_THINKING:-false}}'
      - --port
      - "8000"
    environment:
      # Optional: only needed if the HF cache is cold and the host requires
      # authenticated pulls (Qwen3-0.6B itself is public).
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ../training/artifacts/adapter-v2:/adapters/adapter-v2:ro
      - veridoc_hf_cache:/root/.cache/huggingface
    # Internal only — no host port published.
    expose:
      - "8000"
    networks:
      - veridoc
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # start_period covers the first-run model download + weight load; on a warm
    # HF cache the server is typically ready in well under a minute.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  ai:
    environment:
      AI_INFERENCE_PROVIDER: openai_compatible
      AI_INFERENCE_BASE_URL: http://vllm:8000/v1
      AI_INFERENCE_MODEL: ${AI_INFERENCE_MODEL:-veridoc-extract}
      # RAG buffers a full verified generation before streaming; give the small
      # GPU model headroom over the 60s default. In grounded-QA mode the
      # thinking trace consumes the token budget before the answer, so raise
      # AI_INFERENCE_MAX_TOKENS alongside VLLM_ENABLE_THINKING=true.
      AI_INFERENCE_TIMEOUT_S: "120"
      AI_INFERENCE_MAX_TOKENS: ${AI_INFERENCE_MAX_TOKENS:-512}
    depends_on:
      vllm:
        condition: service_healthy

volumes:
  veridoc_hf_cache:
