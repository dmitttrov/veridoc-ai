# Local development stack for the Phase 1 vertical slice.
# Runs with no GPU and no paid services.
#
# Topology:
#   web (nginx, static)  ->  published on host :5173
#   api (NestJS gateway) ->  published on host :3000  (the public edge)
#   ai  (FastAPI)        ->  INTERNAL ONLY, no host port (see SECURITY.md)
#   db  (postgres+pgvector) -> INTERNAL ONLY, no host port
#
# The AI service runs pending migrations on start, then serves.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: veridoc
      POSTGRES_PASSWORD: veridoc
      POSTGRES_DB: veridoc
    # Internal only — no host port published.
    expose:
      - "5432"
    volumes:
      - veridoc_pgdata:/var/lib/postgresql/data
    networks:
      - veridoc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridoc -d veridoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build:
      context: ..
      dockerfile: infra/docker/ai.Dockerfile
    environment:
      AI_INFERENCE_PROVIDER: mock
      AI_MODEL_NAME: veridoc-mock-0.1
      AI_DATABASE_URL: postgresql://veridoc:veridoc@db:5432/veridoc
      AI_EMBEDDING_PROVIDER: deterministic
      AI_RERANKER_PROVIDER: deterministic
    # No `ports:` mapping — the AI service is reachable only on the internal
    # network, by the gateway. Do not expose it to the host or the internet.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - veridoc
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: "3000"
      AI_SERVICE_URL: http://ai:8000
      WEB_ORIGIN: http://localhost:5173
      AI_REQUEST_TIMEOUT_MS: "30000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      ai:
        condition: service_healthy
    networks:
      - veridoc

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - veridoc

volumes:
  veridoc_pgdata:

networks:
  veridoc:
    driver: bridge
