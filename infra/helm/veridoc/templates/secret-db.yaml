{{- if or .Values.postgresql.enabled .Values.externalDatabase.url }}
{{- $user := .Values.postgresql.auth.username -}}
{{- $db := .Values.postgresql.auth.database -}}
{{- $pw := include "veridoc.db.password" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "veridoc.fullname" .) }}
  labels:
    {{- include "veridoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ $pw | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s:5432/%s" $user $pw (include "veridoc.postgresql.fullname" .) $db | quote }}
  {{- else }}
  database-url: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}
