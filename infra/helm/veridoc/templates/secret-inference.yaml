{{- if and .Values.secrets.inferenceApiKey (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-inference" (include "veridoc.fullname" .) }}
  labels:
    {{- include "veridoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
type: Opaque
stringData:
  inference-api-key: {{ .Values.secrets.inferenceApiKey | quote }}
{{- end }}
